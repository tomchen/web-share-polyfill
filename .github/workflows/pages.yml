# Builds the docs + demo site and deploys it to GitHub Pages
# (Settings → Pages → Source: GitHub Actions).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Its commits don't trigger a push event (they use the workflow token), so redeploy when it finishes
  workflow_run:
    workflows: [Browser support]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run site
        env:
          SITE_CNAME: web-share-polyfill.js.org
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
