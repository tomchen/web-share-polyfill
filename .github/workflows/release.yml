# Publishes to npm when a version tag is pushed (`bun run release patch` does that through vbt),
# after the full CI (ci.yml) passes on the tagged commit.
# Bun installs and builds; npm publishes, for provenance and trusted publishing.
#
# npm authentication, either:
#   A. Trusted publishing (recommended, no secret): on npmjs.com, package settings → Trusted publisher →
#      GitHub Actions, repository tomchen/web-share-polyfill, workflow release.yml.
#      A package must exist before it can be configured, so do the very first publish with option B
#      (or `npm publish` from your machine), then switch.
#   B. A granular access token with publish rights, saved as the NPM_TOKEN repository secret.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Publish to npm
        run: npm publish --provenance --access public --tag ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
