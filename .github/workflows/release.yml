# Publishes to npm when a version tag is pushed (`bun run release patch` does that through vbt),
# after the full CI (ci.yml) passes on the tagged commit.
# Bun installs and builds; npm publishes, for provenance and trusted publishing.
#
# npm authentication: trusted publishing (npmjs.com, package settings → Trusted publisher → GitHub Actions,
# repository tomchen/web-share-polyfill, workflow release.yml), so no token is needed.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Skipped when the version is already on npm, so that a rerun doesn't fail
      - name: Publish to npm
        run: |
          if npm view "web-share-polyfill@${GITHUB_REF_NAME#v}" version > /dev/null 2>&1; then
            echo "web-share-polyfill@${GITHUB_REF_NAME#v} is already on npm"
          else
            npm publish --provenance --access public --tag ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
          fi
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
